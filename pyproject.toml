[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-controller"
version = "0.1.0"
description = "Bank statement to invoice reconciliation agent with measured accuracy"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "rapidfuzz>=3.9",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
